name: Build APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: |
          unzip -o dima-boxing-online.zip
          cd dima-boxing
          sed -i 's/new Peer(PRE+code):new Peer()/new Peer(PRE+code,{config:{iceServers:ICE}}):new Peer({config:{iceServers:ICE}})/' online.js
          grep -q 'iceServers:ICE' online.js
          sed -i 's#<script src="online.js">#<script src="turn.js"></script><script src="online.js">#' index.html
          npm install
          mkdir -p www
          cp index.html online.js ../turn.js node_modules/peerjs/dist/peerjs.min.js www/
          npx cap add android
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dima-boxing-apk
          path: dima-boxing/android/app/build/outputs/apk/debug/app-debug.apk
